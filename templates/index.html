<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store API</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:90%;
            max-width:1100px;
            background:#fff;
            border-radius:18px;
            padding:70px;
            box-shadow:0 20px 45px rgba(0,0,0,.12);

            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        .content{
            max-width:650px;
        }

        h1{
            font-size:55px;
            color:#222;
            margin-bottom:15px;
        }

        h2{
            font-size:28px;
            color:#444;
            margin-bottom:25px;
        }

        p{
            color:#777;
            font-size:18px;
            line-height:1.8;
            margin-bottom:40px;
        }

        .status{
            display:inline-block;
            background:#d1fae5;
            color:#065f46;
            padding:12px 28px;
            border-radius:50px;
            font-weight:bold;
            margin-bottom:35px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:15px 35px;
            border-radius:8px;
            font-size:15px;
            font-weight:bold;
            transition:.3s;
        }

        .primary{
            background:#111;
            color:white;
        }

        .primary:hover{
            background:#333;
        }

        .secondary{
            border:2px solid #111;
            color:#111;
        }

        .secondary:hover{
            background:#12e08a;
            color:#111;
        }

        footer{
            margin-top:50px;
            color:#999;
            font-size:14px;
        }

        @media(max-width:768px){

            .container{
                padding:40px 25px;
            }

            h1{
                font-size:40px;
            }

            h2{
                font-size:22px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="content">

        <div class="status">
            ● API ONLINE
        </div>

        <h1>My Store API</h1>

        <h2>REST API para gerenciamento de lojas</h2>

        <p>
            Bem-vindo à My Store API.
            O serviço está funcionando normalmente e pronto para receber
            requisições autenticadas via JWT.
        </p>

        <div class="buttons">

            <a href="https://mystore-api-n1f9.onrender.com/adm" class="btn secondary">
                Acessar Painel
            </a>

            <a href="https://github.com/hitamarpereiras/myStore_api/blob/main/README.md" class="btn primary">
                Suporte
            </a>

        </div>

        <footer>
            Desenvolvido com Django REST Framework • JWT • PostgreSQL
        </footer>

    </div>

</div>

</body>
</html>
